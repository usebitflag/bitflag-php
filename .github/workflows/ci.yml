name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        dependencies: [lowest, highest]
    name: PHP ${{ matrix.php }} (${{ matrix.dependencies }})
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - name: Install dependencies
        run: composer update --${{ matrix.dependencies == 'lowest' && 'prefer-lowest' || 'prefer-stable' }} --prefer-dist --no-interaction --no-progress
      - name: Code style
        run: vendor/bin/pint --test
      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G
      - name: Tests
        run: vendor/bin/pest
