name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        dependencies: [lowest, highest]
    name: PHP ${{ matrix.php }} (${{ matrix.dependencies }})
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - name: Install dependencies
        run: composer update --${{ matrix.dependencies == 'lowest' && 'prefer-lowest' || 'prefer-stable' }} --prefer-dist --no-interaction --no-progress
      - name: Code style
        run: vendor/bin/pint --test
      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G
      - name: Fetch the pinned protocol release
        env:
          GH_TOKEN: ${{ secrets.PROTOCOL_READ_TOKEN }}
        run: scripts/fetch-protocol-fixtures.sh
      - name: Tests (unit, architecture and conformance)
        run: vendor/bin/pest

  mutation:
    runs-on: ubuntu-latest
    name: Mutation testing
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: pcov
          tools: composer:v2
      - name: Install dependencies and Infection
        run: |
          composer config --no-plugins allow-plugins.infection/extension-installer true
          composer require --dev infection/infection:^0.35 --update-with-all-dependencies --prefer-dist --no-interaction --no-progress
      - name: Fetch the pinned protocol release
        env:
          GH_TOKEN: ${{ secrets.PROTOCOL_READ_TOKEN }}
        run: scripts/fetch-protocol-fixtures.sh
      - name: Infection (minimum MSI 85%)
        run: vendor/bin/infection --threads=max --no-progress --min-msi=85 --min-covered-msi=85
